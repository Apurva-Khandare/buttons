<!DOCTYPE html>
<html>
<head>
    <title>Buttons</title>
    <style>
    .btn-1{
        background-color:lightgrey;
        border: solid 2px black;
        color: black;
        font-size: 50px;
        padding: 3px;
        font-family: fantasy;
        margin: 20px;
        cursor: pointer;
    }
    .btn-2{
        background-color: blue;
        color: white;
        font-size: 45px;
        border: dotted 3px white;
        border-radius: 10px;
        padding: 3px;
        text-align: left;
        cursor: pointer;
    }
    .btn-3{
        color: whitesmoke;
        background-color: red;
        font-size: 50px;
        padding: 5px;
        border-radius: 35px;
        border: double 2px black;
        cursor: pointer;
    }
    .btn-4{
        background-color: green;
        color: white;
        font-size: 50px;
        border-radius: 20px;
        border: dashed 2px black;
        cursor: pointer;
    }
    .btn-5{
        background-color: burlywood;
        color: brown;
        font-size: 40px;
        padding: 5px;
        border-radius: 50%;
        font-family: cursive;
        cursor: pointer;
    }
    .btn-6{
        background-color: greenyellow;
        color: black;
        font-size: 45px;
        cursor: pointer;
        font-family: cursive;
     }
     .btn-6:hover{
        background-color: darkgreen;
        border: double 3px black;
    }
    .btn-7{
        background-color: white;
        color: lightskyblue;
        font-size: 50px;
        border-radius: 20px;
        border: solid 2px darkblue;
        padding: 3px 3px 3px 3px;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <h1 align="center">Different types of buttons</h1>
    <buttons class="btn-1">Simple</buttons><br/><br/>
    <buttons class="btn-2">primary</buttons><br/><br/>
    <buttons class="btn-3">Danger</buttons><br/><br/>
    <buttons class="btn-4">Success</buttons><br/><br/>
    <buttons class="btn-5">Rounded</buttons><br/><br/>
    <buttons class="btn-6">Hover</buttons><br/><br/>
    <buttons class="btn-7">outline</buttons>
</body>
</html>
